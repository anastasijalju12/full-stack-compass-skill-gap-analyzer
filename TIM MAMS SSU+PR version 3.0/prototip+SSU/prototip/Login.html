<!DOCTYPE html>

<!-- 
Autor: Sofija Nikolić
Predmet: Principi softverskog inženjerstva
Projekat: Kompas
Opis: Prototip stranice za prijavu korisnika
Tim: MAMS
-->

<html lang="sr">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompas - Prijava</title>
    <link rel="icon" type="image/png" href="images/logo/compas.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="header.css">

    <style>
        .customCard {
            background-color: #f2a65a;
            color: #000000;
            border-radius: 20px;
            border: solid #000000 3px;
            font-size: 18px;
            margin-top: 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .custom-btn {
            background-color: #000000;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        .custom-btn:hover {
            background-color: #333333;
            color: white;
        }

        .secondary-link {
            color: #000000;
            font-weight: 600;
            text-decoration: none;
        }

        .secondary-link:hover {
            text-decoration: underline;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- NASLOV STRANICE -->
    <div class="container">
        <div class="page-header text-center">
            <h1 class="display-4">Prijava</h1>
        </div>

        <!-- FORMA ZA PRIJAVU -->
        <div class="row justify-content-center mt-4">
            <div class="col-lg-6 col-md-8 col-12 customCard px-4 py-4">

                <!-- IZMJENA: dodat id="loginForm", maknut action -->
                <form id="loginForm">

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail adresa</label>
                        <input type="email" class="form-control" id="email" placeholder="Unesite e-mail adresu">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Lozinka</label>
                        <input type="password" class="form-control" id="password" placeholder="Unesite lozinku">
                    </div>

                    <div class="d-flex justify-content-center mt-4">
                        <input type="submit" value="Prijavi se" class="custom-btn">
                    </div>

                    <div class="text-center mt-4">
                        <p class="mb-2">Nemate nalog?</p>
                        <a href="register.html" class="secondary-link">Registrujte se</a>
                    </div>

                    <div class="text-center mt-3">
                        <a href="forgotPassword.html" class="secondary-link">Zaboravljena lozinka?</a>
                    </div>

                    <!-- PROTOTIP LINKOVI ZA ALTERNATIVNE SCENARIJE -->
                    <div class="text-center mt-4">
                        <p class="mb-2"><strong>Simulacija alternativnih scenarija:</strong></p>
                        <a href="LoginError.html" class="secondary-link d-block">Pogrešni kredencijali</a>
                        <a href="LoginNotApproved.html" class="secondary-link d-block">Nalog nije odobren</a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- NAVBAR -->
    <script src="navbar.js"></script>

    <!-- IZMJENA: login logika -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            localStorage.setItem('loggedIn', 'true');
            window.location.href = 'HomeUser.html';
        });
    </script>

</body>
</html>
