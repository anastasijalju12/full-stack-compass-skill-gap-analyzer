{% load static %}
<link rel="stylesheet" href="{% static 'css/common_style/common_style.css' %}">

<div id="ApplyForJobForm" class="modal-overlay" style="display: none;">

    <div class="application-modal__box">
            <button class="application-modal__close-button" onclick="closeApplyForJobForm()">✕</button>

            <h2>Job application</h2>

            <p class="application-modal__info">
                You are applying for the position:
                <strong id="selectedJobTitle"></strong>
                at
                <strong id="selectedCompany"></strong>.
            </p>
            <h3>Resume details</h3>

            <form action="{% url 'apply_for_job' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <input type="hidden" name="ad_id" id="applicationAdId">

                {{ form.as_p }}

                <button type="submit" class="application-form__button--confirm">
                    Submit application
                </button>

            </form>

        </div>

</div>
