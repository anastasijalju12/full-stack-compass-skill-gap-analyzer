{% extends 'base.html' %}
{% block title %}Kompas - Payment Cancelled{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header text-center">
        <h1 class="display-4">Payment cancelled</h1>
    </div>

    <div class="row justify-content-center mt-4 mb-5">
        <div class="col-lg-7 col-md-9 col-12 customCard px-4 px-md-5 py-4 py-md-5 text-center">
            <div class="k-status-icon k-status-icon--warning" aria-hidden="true">!</div>
            <p class="k-status-title k-text-warning">You cancelled the payment process.</p>
            <p class="mt-3">The account was not created and the entered data was not saved.</p>

            <div class="mt-4">
                <a href="{% url 'registration_choice' %}" class="custom-btn">Back to registration</a>
            </div>

            <div class="mt-4">
                <a href="{% url 'public_index' %}" class="secondary-link">Back to home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
