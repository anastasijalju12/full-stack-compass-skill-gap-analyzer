{% extends 'base.html' %}
{% block title %}Kompas - My Profile{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header text-center">
        <h1 class="display-4">My Profile</h1>
    </div>

    <div class="row justify-content-center mt-4 mb-5">
        <div class="col-lg-8 col-12 customCard px-4 px-md-5 py-4 py-md-5">
            <div class="section-title">Personal information</div>

            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.first_name.id_for_label }}" class="form-label">First name</label>
                        {{ form.first_name }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.last_name.id_for_label }}" class="form-label">Last name</label>
                        {{ form.last_name }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                        {{ form.username }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
                        {{ form.email }}
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="{{ form.contact.id_for_label }}" class="form-label">Contact</label>
                        {{ form.contact }}
                    </div>
                </div>

                <div class="text-end mt-3">
                    <button type="submit" class="custom-btn">Update profile</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
