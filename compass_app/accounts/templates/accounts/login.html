{% extends 'base.html' %}
{% block title %}Kompas - Login{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header text-center">
        <h1 class="display-4">Login</h1>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-xl-5 col-lg-6 col-md-8 col-12 customCard px-4 px-md-5 py-4 py-md-5">
            <p class="text-center text-muted mb-4">Sign in to continue to your Kompas account.</p>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                    {{ form.username }}
                </div>

                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                    {{ form.password }}
                </div>

                <div class="text-end">
                    <a href="{% url 'forgot_password' %}" class="secondary-link small">Forgot your password?</a>
                </div>

                <div class="d-grid mt-4">
                    <input type="submit" value="Log in" class="custom-btn">
                </div>

                <div class="text-center mt-4">
                    <span class="text-muted me-1">Don't have an account?</span>
                    <a href="{% url 'registration_choice' %}" class="secondary-link">Sign up</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
