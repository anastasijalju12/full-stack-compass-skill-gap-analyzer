{% extends 'base.html' %}
{% block title %}Kompas - Reset Password{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header text-center">
        <h1 class="display-4">Set a new password</h1>
    </div>

    <div class="row justify-content-center mt-4 mb-5">
        <div class="col-xl-5 col-lg-6 col-md-8 col-12 customCard px-4 px-md-5 py-4 py-md-5">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">New password</label>
                    {{ form.password }}
                </div>

                <div class="mb-3">
                    <label for="{{ form.password_confirm.id_for_label }}" class="form-label">Confirm new password</label>
                    {{ form.password_confirm }}
                </div>

                <div class="d-grid mt-4">
                    <input type="submit" value="Save password" class="custom-btn">
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
