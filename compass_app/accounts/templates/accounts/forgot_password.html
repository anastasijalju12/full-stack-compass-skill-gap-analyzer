{% extends 'base.html' %}
{% block title %}Kompas - Forgot Password{% endblock %}
{% block content %}
<div class="container">
    <div class="page-header text-center">
        <h1 class="display-4">Forgot Password</h1>
    </div>

    <div class="row justify-content-center mt-4 mb-5">
        <div class="col-xl-5 col-lg-6 col-md-8 col-12 customCard px-4 px-md-5 py-4 py-md-5">
            <p class="text-center text-muted mb-4">
                Enter the email address associated with your account. We'll send you a link to reset your password.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.email.id_for_label }}" class="form-label">Email address</label>
                    {{ form.email }}
                </div>

                <div class="d-grid mt-4">
                    <input type="submit" value="Send link" class="custom-btn">
                </div>

                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="secondary-link">&larr; Back to login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
